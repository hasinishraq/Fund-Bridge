spring:
  application:
    name: user-service
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8899
  cloud:
    config:
      fail-fast: true
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/fundbridge?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${USER_DB_USERNAME:root}
    password: ${USER_DB_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

security:
  jwt:
    secret: ${AUTH_JWT_SECRET:your_256_bit_jwt_secret_key_here_minimum_32_characters}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost:5174
      - http://localhost:5175
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    exposed-headers:
      - Authorization
    allow-credentials: true

server:
  port: ${USER_SERVICE_PORT:8086}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
