server:
  port: ${API_GATEWAY_PORT:8080}
spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials,RETAIN_UNIQUE
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:4173
              - http://localhost:5174
              - http://localhost:5175
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true
      routes:
        - id: auth-service
          # Direct URL to avoid discovery dependency in dev; override with AUTH_SERVICE_URL if needed.
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/auth/**,/api/kyc/**
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8086}
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/users/**
        - id: admin-service
          uri: lb://admin-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/admin/**
        - id: loan-management-service
          uri: lb://loan-management-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/loans/**,/api/credit/**,/api/funding/**,/api/repayments/**
        - id: wallet-service
          uri: lb://wallet-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/wallet/**,/api/payments/**
        - id: notification-service
          uri: lb://notification-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/notifications/**
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
