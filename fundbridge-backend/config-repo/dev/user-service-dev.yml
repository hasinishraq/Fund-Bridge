server:
  port: ${USER_SERVICE_PORT:8086}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fundbridge?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: "12345678"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

security:
  jwt:
    secret: ${AUTH_JWT_SECRET:change-me-please-change-me-please-123456}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost:5174
      - http://localhost:5175
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    exposed-headers:
      - Authorization
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
    allow-credentials: true
