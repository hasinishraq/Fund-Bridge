server:
  port: ${AUTH_SERVICE_PORT:8081}
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fundbridge?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: "12345678"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
security:
  jwt:
    secret: ${AUTH_JWT_SECRET:your_256_bit_jwt_secret_key_here_minimum_32_characters}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}
app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://localhost:5174
      - http://localhost:5175
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
    exposed-headers:
      - Authorization
    allow-credentials: true
  recaptcha:
    enabled: ${AUTH_RECAPTCHA_ENABLED:true}
    secret-key: ${AUTH_RECAPTCHA_SECRET_KEY:your_recaptcha_secret_key_here}
    verify-url: https://www.google.com/recaptcha/api/siteverify
    minimum-score: ${AUTH_RECAPTCHA_MIN_SCORE:0.5}
sumsub:
  enabled: ${SUMSUB_ENABLED:true}
  base-url: ${SUMSUB_BASE_URL:https://test-api.sumsub.com}
  # Provide your sandbox credentials via env; defaults left blank to force override.
  app-token: ${SUMSUB_APP_TOKEN:your_sumsub_app_token_here}
  secret-key: ${SUMSUB_SECRET_KEY:your_sumsub_secret_key_here}
  level-name: ${SUMSUB_LEVEL_NAME:id-only}
  websdk-ttl-seconds: ${SUMSUB_WEBSDK_TTL_SECONDS:900}
  stub-review-url: ${SUMSUB_STUB_REVIEW_URL:https://kyc-demo.localhost/continue}
