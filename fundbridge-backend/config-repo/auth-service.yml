server:
  port: ${AUTH_SERVICE_PORT:8081}

spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${AUTH_DB_USERNAME:}
    password: ${AUTH_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${AUTH_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

security:
  jwt:
    # Must be at least 32 characters (256-bit) to satisfy JJWT key strength requirements.
    secret: ${AUTH_JWT_SECRET:your_256_bit_jwt_secret_key_here_minimum_32_characters}
    # Default to 1h if not provided; must stay >= 60s due to validation.
    expirationSeconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}
    refreshExpirationSeconds: ${AUTH_JWT_REFRESH_EXPIRATION_SECONDS:2592000}

app:
  cors:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:5174,http://localhost:5175}
    allowed-origin-patterns: ${AUTH_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type
    exposed-headers: Authorization
    allow-credentials: true
  recaptcha:
    enabled: ${AUTH_RECAPTCHA_ENABLED:true}
    secret-key: ${AUTH_RECAPTCHA_SECRET_KEY:}
    verify-url: ${AUTH_RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
    minimum-score: ${AUTH_RECAPTCHA_MIN_SCORE:0.5}
  admin-registration:
    enabled: ${AUTH_ADMIN_REGISTRATION_ENABLED:false}
    secret: ${AUTH_ADMIN_REGISTRATION_SECRET:}

brevo:
  enabled: ${BREVO_ENABLED:true}
  api-key: ${BREVO_API_KEY:}
  base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  from-email: ${BREVO_FROM_EMAIL:no-reply@auth.local}
  from-name: ${BREVO_FROM_NAME:FundBridge}
  otp-subject: ${BREVO_OTP_SUBJECT:Your FundBridge verification code}

sumsub:
  enabled: ${SUMSUB_ENABLED:true}
  base-url: ${SUMSUB_BASE_URL:https://api.sumsub.com}
  app-token: ${SUMSUB_APP_TOKEN:}
  secret-key: ${SUMSUB_SECRET_KEY:}
  level-name: ${SUMSUB_LEVEL_NAME:id-only}
  websdk-ttl-seconds: ${SUMSUB_WEBSDK_TTL_SECONDS:900}
  stub-review-url: ${SUMSUB_STUB_REVIEW_URL:}
  webhook-secret: ${SUMSUB_WEBHOOK_SECRET:}

notification:
  client:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8093}
