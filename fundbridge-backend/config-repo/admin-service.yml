server:
  port: ${ADMIN_SERVICE_PORT:8090}

spring:
  datasource:
    url: ${ADMIN_DB_URL:jdbc:mysql://localhost:3306/admin_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${ADMIN_DB_USERNAME:}
    password: ${ADMIN_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${ADMIN_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

wallet:
  client:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8091}

loan:
  client:
    base-url: ${LOAN_SERVICE_URL:http://localhost:8092}
