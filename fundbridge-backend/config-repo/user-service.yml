server:
  port: ${USER_SERVICE_PORT:8086}

spring:
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/fundbridge?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${USER_DB_USERNAME:}
    password: ${USER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${USER_JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

security:
  jwt:
    # Provide a non-empty placeholder to satisfy validation; override via ENV in real deployments.
    secret: ${AUTH_JWT_SECRET:your_256_bit_jwt_secret_key_here_minimum_32_characters}
    expirationSeconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}

app:
  cors:
    allowed-origins: ${USER_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:5174,http://localhost:5175}
    allowed-origin-patterns: ${USER_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: Authorization,Content-Type
    exposed-headers: Authorization
    allow-credentials: true

notification:
  client:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8093}
