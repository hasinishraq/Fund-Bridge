server:
  port: ${USER_SERVICE_PORT:8086}
spring:
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://user-db:3306/fundbridge}
    username: ${USER_DB_USERNAME:user_service}
    password: ${USER_DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

security:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}

app:
  cors:
    allowed-origins: ${USER_ALLOWED_ORIGINS:https://app.fundbridge.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    allowed-origin-patterns:
      - https://*.fundbridge.com
    exposed-headers:
      - Authorization
    allow-credentials: true
