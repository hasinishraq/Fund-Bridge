storage:
  provider: ${STORAGE_PROVIDER:s3}
  endpoint: ${STORAGE_ENDPOINT:https://s3.amazonaws.com}
  bucket: ${STORAGE_BUCKET:fundbridge-wallet}
  base-path: ${STORAGE_BASE_PATH:/wallet}
  credentials:
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
  paths:
    statements: statements
    receipts: receipts
