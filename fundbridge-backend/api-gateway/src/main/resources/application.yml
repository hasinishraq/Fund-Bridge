spring:
  config:
    # Config Server is fixed infra; import shared config over HTTP
    import: optional:configserver:http://localhost:8888
  application:
    name: api-gateway
  cloud:
    config:
      fail-fast: false
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/auth/**
          # Frontend traffic must go through /api/auth/** on the gateway; direct calls stay internal only.
      discovery:
        locator:
          enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
