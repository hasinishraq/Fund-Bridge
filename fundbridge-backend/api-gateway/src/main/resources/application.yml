spring:
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: api-gateway
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: false
    gateway:
      discovery:
        locator:
          enabled: true
server:
  port: 8080
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
