spring:
  application:
    name: api-gateway
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8899
  cloud:
    config:
      fail-fast: false
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials,RETAIN_UNIQUE
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:4173
              - http://localhost:5174
              - http://localhost:5175
            allowedOriginPatterns:
              - http://localhost:*
              - http://127.0.0.1:*
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - Authorization
            allowCredentials: true
      routes:
        - id: auth-service
          # Use direct URL by default to avoid discovery unavailability; set AUTH_SERVICE_URL to override.
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/auth/**,/api/users/**,/api/kyc/**
        - id: admin-service
          uri: lb://admin-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/admin/**
        - id: loan-management-service
          uri: lb://loan-management-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/loans/**,/api/credit/**,/api/funding/**,/api/repayments/**
        - id: wallet-service
          uri: lb://wallet-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/wallet/**,/api/payments/**
        - id: notification-service
          uri: lb://notification-service
          filters:
            - StripPrefix=1
          predicates:
            - Path=/api/notifications/**
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
