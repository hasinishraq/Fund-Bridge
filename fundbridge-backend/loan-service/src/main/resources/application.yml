spring:
  application:
    name: loan-service
  cloud:
    config:
      uri: http://localhost:8888
      fail-fast: true
server:
  port: 0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
