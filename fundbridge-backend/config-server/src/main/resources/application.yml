spring:
  application:
    name: config-server
  profiles:
    # Default to native unless overridden via SPRING_PROFILES_ACTIVE.
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          # Single flat config repo; override via CONFIG_REPO_LOCATIONS if needed.
          # Supports running from repo root, fundbridge-backend, or config-server module directory.
          search-locations: ${CONFIG_REPO_LOCATIONS:file:../config-repo,file:./config-repo,file:./fundbridge-backend/config-repo}
server:
  port: ${CONFIG_SERVER_PORT:8899}
management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
