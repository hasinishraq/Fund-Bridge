spring:
  application:
    name: auth-service
  profiles:
    active: dev
  config:
    import: optional:configserver:http://localhost:8899
  cloud:
    config:
      fail-fast: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/fundbridge?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${AUTH_DB_USERNAME:root}
    password: ${AUTH_DB_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

# Local fallback values so the service can still boot if Config Server is unavailable.
security:
  jwt:
    secret: ${AUTH_JWT_SECRET:your_256_bit_jwt_secret_key_here_minimum_32_characters}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}
server:
  port: 8081
sumsub:
  enabled: ${SUMSUB_ENABLED:true}
  stub-review-url: ${SUMSUB_STUB_REVIEW_URL:https://kyc-demo.localhost/continue}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
