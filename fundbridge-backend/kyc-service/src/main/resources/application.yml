spring:
  config:
    # Config Server is fixed infra; import shared config over HTTP
    import: optional:configserver:http://localhost:8888
  application:
    name: kyc-service
  cloud:
    config:
      fail-fast: true
server:
  port: 0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
