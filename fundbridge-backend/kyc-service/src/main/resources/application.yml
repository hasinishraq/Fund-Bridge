spring:
  config:
    # Config Server is fixed infra; import shared config over HTTP
    import: optional:configserver:http://localhost:8888
  application:
    name: kyc-service
  cloud:
    config:
      fail-fast: true
server:
  port: 0
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info
sumsub:
  enabled: ${SUMSUB_ENABLED:true}
  base-url: ${SUMSUB_BASE_URL:https://api.sumsub.com}
  app-token: ${SUMSUB_APP_TOKEN:your_sumsub_app_token_here}
  secret-key: ${SUMSUB_SECRET_KEY:your_sumsub_secret_key_here}
  level-name: ${SUMSUB_LEVEL_NAME:id-only}
  websdk-ttl-seconds: ${SUMSUB_WEBSDK_TTL_SECONDS:900}
