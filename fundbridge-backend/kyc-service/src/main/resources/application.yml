  secret-key: ${SUMSUB_SECRET_KEY:CSucZDEs5eL2zC6MSrJbIfdhPSdLdcf1}
  level-name: ${SUMSUB_LEVEL_NAME:id-and-liveness}
  websdk-ttl-seconds: ${SUMSUB_WEBSDK_TTL_SECONDS:900}
